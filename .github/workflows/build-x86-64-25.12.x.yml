name: Build 25.12.x x86-64
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build25.sh

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${{ github.event.inputs.custom_router_ip }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi
      
      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Apply Dockerman hotfix
        if: ${{ inputs.include_docker == 'yes' }}
        run: |
          source="$RUNNER_TEMP/docker_rpc.uc"
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/openwrt/luci/1c75ea46c68ebc386fef9922089260de16f30417/applications/luci-app-dockerman/root/usr/share/rpcd/ucode/docker_rpc.uc \
            -o "$source"
          python3 patches/dockerman/apply.py "$source" \
            files/usr/share/rpcd/ucode/docker_rpc.uc | tee dockerman-hotfix.txt
          install -D -m 0755 patches/dockerman/95-docker-log-rotation \
            files/etc/uci-defaults/95-docker-log-rotation
          echo "Docker log rotation default: local driver (only if unset)" | tee -a dockerman-hotfix.txt
          echo "DOCKERMAN_SOURCE_SHA256=$(sha256sum "$source" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Build ImmortalWrt-x86-64-efi 25.12.x
        run: |
          profile="${{ github.event.inputs.profile }}"
          case "$profile" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          include_docker="${{ github.event.inputs.include_docker }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          echo "Building for rootfs_size: $profile"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$ROOTFS_SIZE \
            -e INCLUDE_DOCKER=$include_docker \
            -e DOCKERMAN_SOURCE_SHA256 \
            -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash -e -o pipefail -c '
            /bin/bash /home/build/immortalwrt/build.sh
            if [ "$INCLUDE_DOCKER" = "yes" ]; then
              # Check the APK actually used, not merely a separately downloaded source.
              verify_dir=$(mktemp -d)
              for package in dl/luci-app-dockerman-*.apk; do
                test -f "$package"
                staging_dir/host/bin/apk extract --allow-untrusted \
                  --destination "$verify_dir" "$package"
                echo "$DOCKERMAN_SOURCE_SHA256  $verify_dir/usr/share/rpcd/ucode/docker_rpc.uc" | sha256sum -c -
              done
              # Verify the SquashFS payload used to assemble the firmware image.
              rootfs=$(find build_dir -type f -name root.squashfs -print -quit)
              test -n "$rootfs"
              staging_dir/host/bin/unsquashfs4 -cat "$rootfs" usr/share/rpcd/ucode/docker_rpc.uc | \
                cmp - files/usr/share/rpcd/ucode/docker_rpc.uc
              staging_dir/host/bin/unsquashfs4 -cat "$rootfs" etc/uci-defaults/95-docker-log-rotation | \
                cmp - files/etc/uci-defaults/95-docker-log-rotation
              echo "Dockerman package baseline and firmware overlay verified"
            fi
          '
          

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
           <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            printf '\n### Dockerman hotfix\n```text\n' >> "${{ github.workspace }}/router-info.md"
            cat dockerman-hotfix.txt >> "${{ github.workspace }}/router-info.md"
            printf '```\n' >> "${{ github.workspace }}/router-info.md"
            extra_content="#### 默认带docker"
            echo -e "\n$extra_content" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name == 'master' && 'Autobuild-x86-64' || 'Autobuild-x86-64-dev' }}
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
